services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: jobhub-postgres
    environment:
      POSTGRES_DB: jobhub
      POSTGRES_USER: jobhub
      POSTGRES_PASSWORD: jobhub
    ports:
      - "5432:5432"
    volumes:
      - jobhub_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhub -d jobhub"]
      interval: 5s
      timeout: 5s
      retries: 20

  platform-api:
    build: ./apps/platform-api
    container_name: jobhub-platform-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JOBHUB_DB_URL: jdbc:postgresql://postgres:5432/jobhub
      JOBHUB_DB_USER: jobhub
      JOBHUB_DB_PASSWORD: jobhub
      JOBHUB_JWT_SECRET: jobhub-dev-secret-change-me-please-32-bytes
      JOBHUB_WEB_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"

  web:
    build: ./apps/web
    container_name: jobhub-web
    depends_on:
      - platform-api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"

  agent-runtime:
    build: ./apps/agent-runtime
    container_name: jobhub-agent-runtime
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "8090:8090"

volumes:
  jobhub_pgdata:
