version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobhub-postgres
    environment:
      POSTGRES_DB: jobhub
      POSTGRES_USER: jobhub
      POSTGRES_PASSWORD: jobhub
    ports:
      - "5432:5432"
    volumes:
      - jobhub_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhub -d jobhub"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - jobhub-net

  platform-api:
    build: ./apps/platform-api
    container_name: jobhub-platform-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      JOBHUB_DB_URL: jdbc:postgresql://postgres:5432/jobhub
      JOBHUB_DB_USER: jobhub
      JOBHUB_DB_PASSWORD: jobhub
      JOBHUB_JWT_SECRET: ${JOBHUB_JWT_SECRET:-jobhub-dev-secret-change-me-please-32-bytes}
      JOBHUB_WEB_ORIGIN: ${JOBHUB_WEB_ORIGIN:-https://jobhubs.aavartlabs.com}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:?set OLLAMA_BASE_URL in .env}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-ministral-3:14b}
      EVER_JOBS_API_URL: ${EVER_JOBS_API_URL:?set EVER_JOBS_API_URL in .env}
      EVER_JOBS_API_KEY: ${EVER_JOBS_API_KEY:-jobhub-ng-dev-key-2026}
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - jobhub-net

  web:
    build: ./apps/web
    container_name: jobhub-web
    depends_on:
      - platform-api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://jobhub-platform-api:8080}
      PORT: 3000
    ports:
      - "3001:3000"
    networks:
      - jobhub-net

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: jobhub-cloudflare-tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - web
    environment:
      - TUNNEL_ORIGIN_URL=jobhub-web:3000
    networks:
      - jobhub-net

volumes:
  jobhub_pgdata:

networks:
  jobhub-net:
    external: true
    name: jobhub
