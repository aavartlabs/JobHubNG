let state={role:'seeker',logged:false,route:'landing',query:'',loc:'',selectedJob:1,saved:[1,6],applications:[1,3],alerts:[],toast:'',mobileMenu:false,filters:{remote:false,experience:'Any',industry:'Any',type:'Any'},profile:{name:'Sarah Ahmed',email:'sarah@example.com',skills:'Java, Spring Boot, AWS, PostgreSQL',location:'Dubai, UAE',experience:'8 years'}};

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function routeTo(r){
  const portalNeeded=PORTAL_ROUTES.includes(r);
  if(portalNeeded && !state.logged){state.route='login';render();toast('Please sign in to continue');return}
  if(portalNeeded && !canAccess(r)){toast('This module is not available for the current persona');return}
  state.route=r;state.mobileMenu=false;persist();render();window.scrollTo({top:0,behavior:'smooth'});
}
function go(r){routeTo(r)}
function canAccess(route){return !ACCESS[route] || ACCESS[route].includes(state.role)}
function setRole(r){state.role=r;state.logged=true;state.route='dashboard';persist();render();toast(ROLES[r].name+' workspace loaded')}
function switchRole(r){state.role=r;state.logged=true;state.route='dashboard';persist();render()}
function loginPersona(r){state.role=r;state.logged=true;state.route='dashboard';persist();render();toast('Welcome to '+ROLES[r].name+' workspace')}
function logout(){state.logged=false;state.route='landing';state.mobileMenu=false;persist();render();toast('Signed out')}
function B(label,cls,onclick){return `<button class="btn ${cls||'secondary'}" onclick="${onclick}">${label}</button>`}
function cardJob(j,compact=false){return `<article class="job-card card ${compact?'compact':''}"><div class="logo">${esc(j.company[0])}</div><div><h3>${esc(j.title)}</h3><div class="company">${esc(j.company)} · ${esc(j.loc)}</div><div class="meta"><span class="badge green">${j.match}% Match</span><span class="badge gray">${esc(j.mode)}</span><span class="badge gray">${esc(j.type)}</span><span class="badge gray">${esc(j.posted)}</span></div><div class="skills">${j.skills.map(s=>`<span class="skill">${esc(s)}</span>`).join('')}</div></div><div class="job-actions">${B(state.saved.includes(j.id)?'Saved':'Save','secondary','toggleSave('+j.id+')')}${B('View','primary','openJob('+j.id+')')}</div></article>`}
function toggleSave(id){const i=state.saved.indexOf(id);if(i>=0){state.saved.splice(i,1);toast('Removed from saved jobs')}else{state.saved.push(id);toast('Job saved to My Jobs')}persist();render()}
function applyJob(id){if(!state.applications.includes(id))state.applications.push(id);persist();toast('Application recorded in demo mode');if(state.logged && ['seeker','fresher','professional'].includes(state.role))state.route='applications';render()}
function openJob(id){state.selectedJob=id;state.route='jobDetail';render()}
function runPublicSearch(){const q=document.getElementById('publicQ')?.value||'',l=document.getElementById('publicLoc')?.value||'';state.query=q;state.loc=l;state.route='jobs';render()}
function runPortalSearch(){state.query=document.getElementById('portalQ')?.value||'';state.loc=document.getElementById('portalLoc')?.value||'';state.route='jobs';persist();render()}
function quickSearch(q,l=''){state.query=q;state.loc=l;state.route='jobs';render()}
function filteredJobs(){let xs=JOBS.filter(j=>{const q=state.query.trim().toLowerCase();const l=state.loc.trim().toLowerCase();const qok=!q||[j.title,j.company,j.skills.join(' '),j.industry].join(' ').toLowerCase().includes(q);const lok=!l||j.loc.toLowerCase().includes(l)||j.mode.toLowerCase().includes(l);const rok=!state.filters.remote||j.mode==='Remote';const iok=state.filters.industry==='Any'||j.industry===state.filters.industry;const eok=state.filters.experience==='Any'||j.exp===state.filters.experience;const tok=state.filters.type==='Any'||j.type===state.filters.type;return qok&&lok&&rok&&iok&&eok&&tok});return xs.length?xs:JOBS}
function applyFilters(){state.filters.remote=!!document.getElementById('fRemote')?.checked;state.filters.experience=document.getElementById('fExp')?.value||'Any';state.filters.industry=document.getElementById('fIndustry')?.value||'Any';state.filters.type=document.getElementById('fType')?.value||'Any';closeModal();persist();render();toast('Filters applied')}
function createAlert(){const q=document.getElementById('alertQ')?.value||state.query||'Software Engineer';const l=document.getElementById('alertL')?.value||state.loc||'Remote';state.alerts.push({q,l,freq:document.getElementById('alertF')?.value||'Daily'});closeModal();persist();toast('Job alert created');render()}
function modal(title,body,action='closeModal()',actionLabel='Close'){document.getElementById('modal')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal-backdrop" id="modal"><div class="modal-box"><div class="row between"><div><h2 style="margin:0;font-size:20px">${title}</h2></div><button class="btn secondary" onclick="closeModal()">✕</button></div><div style="margin-top:14px">${body}</div><div class="form-actions">${B('Cancel','secondary','closeModal()')}${B(actionLabel,'primary',action)}</div></div></div>`)}

function jobs(){
  const xs=filteredJobs();
  const body=`<div class="wrap"><div class="section-head"><div><h1 class="title">Search Jobs</h1><p class="subtitle">${xs.length} relevant opportunities · aggregated across sources</p></div><div>${B('Create alert','secondary','createAlertModal()')}</div></div><div class="searchbar"><input id="portalQ" placeholder="Job title, skills, company" value="${esc(state.query)}"><input id="portalLoc" placeholder="Location / remote" value="${esc(state.loc)}">${B('Search','primary','runPortalSearch()')}${B('Filters','secondary','filterModal()')}</div><div class="tabs"><div class="tab active">Relevance</div><div class="tab">Freshness</div><div class="tab">Salary</div><div class="tab">Match score</div></div><div class="page-grid"><div><div class="job-list">${xs.map(j=>cardJob(j)).join('')}</div></div><aside class="stack"><div class="card pad"><h3 style="margin-top:0">Refine your search</h3><label style="display:flex;gap:8px;margin:10px 0"><input type="checkbox" ${state.filters.remote?'checked':''} onchange="state.filters.remote=this.checked;persist();render()"> Remote only</label><div class="field"><label>Experience</label><select onchange="state.filters.experience=this.value;persist();render()"><option>Any</option><option>0–2 years</option><option>3–6 years</option><option>7–10 years</option><option>10+ years</option></select></div><div class="field" style="margin-top:10px"><label>Industry</label><select onchange="state.filters.industry=this.value;persist();render()"><option>Any</option>${INDUSTRIES.map(x=>`<option ${state.filters.industry===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="card pad ai-panel"><span class="badge purple">AI insight</span><h3>Why these results?</h3><p class="small muted">JobHub weighs title, skills, location, seniority and profile fit. Match scores are indicative, not hiring decisions.</p>${B('View your profile','secondary',"go('profile')")}</div></aside></div></div>`;

}
function jobDetail(){const j=JOBS.find(x=>x.id===state.selectedJob)||JOBS[0];return `${state.logged?portalShell(`<div class="stack"><div class="card pad"><div class="row between" style="align-items:flex-start"><div><span class="badge green">${j.match}% AI Match</span><h1 class="title" style="margin-top:8px">${esc(j.title)}</h1><p class="subtitle">${esc(j.company)} · ${esc(j.loc)} · ${esc(j.mode)} · ${esc(j.type)}</p></div><div class="row"><span class="badge gray">${esc(j.salary)}</span>${B(state.saved.includes(j.id)?'Saved':'Save','secondary','toggleSave('+j.id+')')}</div></div><div class="skills" style="margin-top:12px">${j.skills.map(s=>`<span class="skill">${s}</span>`).join('')}</div><div class="actions" style="margin-top:14px;display:flex;gap:8px">${B('Apply now','primary','applyJob('+j.id+')')}${B('Create alert','secondary','createAlertModal()')}${B('Share','ghost','toast(\'Share link copied in demo mode\')')}</div></div><div class="page-grid"><div class="stack"><div class="card pad"><h3>Job description</h3><p class="small muted">Build and operate scalable services in a modern engineering environment. Collaborate with product and platform teams and contribute to high-quality delivery.</p><h3>Key requirements</h3><ul>${j.skills.map(s=>`<li>${s} experience</li>`).join('')}</ul><h3>Benefits</h3><div class="skills"><span class="skill">Flexible work</span><span class="skill">Learning budget</span><span class="skill">Health benefits</span><span class="skill">Performance bonus</span></div></div><div class="card pad"><h3>Source & freshness</h3><p class="small muted">Source: ${esc(j.source)} · last checked today · duplicate validation enabled.</p>${B('Report this job','secondary','toast(\'Report recorded for review\')')}</div></div><aside class="stack"><div class="card pad ai-panel"><span class="badge purple">AI Career Match</span><h3>${j.match}% match</h3><p class="small muted">Strong overlap with your current profile. Top strengths: ${j.skills.slice(0,3).join(', ')}. function companies(){return `${publicHeader()}<main class="section"><div class="wrap"><div class="section-head"><div><h1 class="title">Companies</h1><p class="subtitle">Explore employers represented across JobHub sources.</p></div></div><div class="grid g3">${COMPANIES.map((c,i)=>`<div class="card pad"><div class="row"><div class="avatar">${c.name[0]}</div><div style="flex:1"><h3 style="margin:0">${esc(c.name)}</h3><p class="small muted">${esc(c.industry)}</p></div></div><p>${esc(c.roles)}</p>${B('View jobs','secondary','quickSearch(\''+esc(c.name)+'\')')}</div>`).join('')}</div></div></main>${footer()}`}
function companyView(){const name=state.query||'Northstar Technologies';return `${publicHeader()}<main class="section"><div class="wrap"><div class="hero-panel"><div class="row between"><div><span class="badge" style="background:#fff;color:#155eef">Company profile</span><h1 style="margin:9px 0;font-size:30px">${esc(name)}</h1><p style="margin:0;color:#d9e9ff">Technology · 248 open roles</p></div>${B('View open jobs','secondary','quickSearch(\''+esc(name)+'\')')}</div></div><div class="grid g3" style="margin-top:16px"><div class="card pad"><h3>About</h3><p class="small muted">Employer overview, culture and hiring information represented in this prototype.</p></div><div class="card pad"><h3>Open roles</h3><div class="metric">248</div><div class="small muted">Across locations</div></div><div class="card pad"><h3>Hiring focus</h3><p class="small muted">Backend, cloud, data and AI roles.</p></div></div></div></main>${footer()}`}
function industries(){return `${publicHeader()}<main class="section"><div class="wrap"><div class="section-head"><div><h1 class="title">Industries</h1><p class="subtitle">Browse jobs and trends by industry.</p></div></div><div class="grid g4">${INDUSTRIES.map(x=>`<div class="card pad" onclick="quickSearch('${x}')" style="cursor:pointer"><div class="iconbox">✦</div><h3>${x}</h3><p class="small muted">Explore jobs and market signals →</p></div>`).join('')}</div></div></main>${footer()}`}
function insights(){return `${publicHeader()}<main class="section"><div class="wrap"><div class="section-head"><div><h1 class="title">Career Insights</h1><p class="subtitle">Practical guidance backed by JobHub market intelligence.</p></div></div><div class="grid g3">${[['Where Java demand is rising','market'],['AI is reshaping engineering roles','market'],['Resume optimization with AI','assistant'],['Salary and role benchmarks','market'],['Cloud architect skill gaps','learning'],['Remote work trends','market']].map(x=>`<div class="card news-card" onclick="go('${x[1]}')"><span class="tag">JOBHUB INSIGHT</span><h3>${x[0]}</h3><p>Explore the evidence, skills and practical actions behind this insight.</p><a style="color:var(--blue);font-weight:800;font-size:11px">Open insight →</a></div>`).join('')}</div></div></main>${footer()}`}
function resources(){return `${publicHeader()}<main class="section"><div class="wrap"><div class="section-head"><div><h1 class="title">Resources</h1><p class="subtitle">Guides, tools and platform information.</p></div></div><div class="grid g3">${['Job Search Guide','Resume Checklist','Interview Preparation','Candidate Privacy','Employer Onboarding','Help Center'].map(x=>`<div class="card pad"><div class="iconbox">▤</div><h3>${x}</h3><p class="small muted">Practical JobHub resource for better job search and hiring outcomes.</p>${B('Open','secondary','toast(\''+x+' opened in demo mode\')')}</div>`).join('')}</div></div></main>${footer()}`}
function login(showEmployer=false){return `<div class="login"><div class="login-card"><div class="login-art"><div><div class="brand">▰ Job<span style="color:#62a6ff">Hub</span></div><h1 style="font-size:34px;line-height:1.1;margin-top:28px">One platform.<br>Six professional experiences.</h1><p style="color:#cfe1f7">Choose a persona to preview role-based navigation, forms, search, dashboards and access controls.</p></div><div class="small">Demo prototype · No real authentication</div></div><div class="login-form"><div class="row between"><div><h1 style="margin:0">${showEmployer?'Employer / Recruiter sign in':'Welcome back'}</h1><p class="small muted">Select a persona for the prototype.</p></div>${B('← Home','ghost','go(\'landing\')')}</div><div class="roles-grid" style="margin-top:18px">${Object.entries(ROLES).map(([k,r])=>`<div class="role-option ${state.role===k?'selected':''}" onclick="state.role='${k}';render()"><b>${r.name}</b><div class="small muted">${r.group}</div></div>`).join('')}</div><div class="grid g2" style="margin-top:14px"><div class="field"><label>Email</label><input value="demo@jobhub.local"></div><div class="field"><label>Password</label><input type="password" value="password"></div></div><div style="margin-top:14px">${B('Sign in to workspace','primary','loginPersona(\''+state.role+'\')')} ${B('Create account','secondary','go(\'signup\')')}</div><p class="small muted" style="margin-top:12px">Role-based UI is simulated. Production RBAC belongs in the backend/API.</p></div></div></div>`}
function signup(){return `<div class="login"><div class="login-card"><div class="login-form" style="grid-column:1/-1"><div class="row between"><div><div class="brand dark">▰ Job<span style="color:var(--blue)">Hub</span></div><h1 style="margin:18px 0 4px">Create your JobHub account</h1><p class="small muted">Profile + preferences + resume intelligence unlocks personalized matching.</p></div>${B('Already have an account','secondary','go(\'login\')')}</div><div class="grid g2" style="margin-top:18px"><div class="field"><label>Full name</label><input id="sgName" value="${esc(state.profile.name)}"></div><div class="field"><label>Email</label><input id="sgEmail" value="${esc(state.profile.email)}"></div><div class="field"><label>Password</label><input type="password" value="password"></div><div class="field"><label>Primary persona</label><select id="sgRole">${Object.entries(ROLES).slice(0,3).map(([k,r])=>`<option value="${k}">${r.name}</option>`).join('')}</select></div></div><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" checked> I agree to JobHub privacy and terms</label><div class="form-actions">${B('Continue to onboarding','primary','saveSignup()')}</div></div></div></div>`}
function saveSignup(){state.profile.name=document.getElementById('sgName')?.value||state.profile.name;state.profile.email=document.getElementById('sgEmail')?.value||state.profile.email;state.role=document.getElementById('sgRole')?.value||'seeker';state.logged=true;state.route='onboarding';persist();render()}
function onboarding(){return `${portalShell(`<div class="stack"><div class="card pad"><div class="steps"><span class="step active">1 Account</span><span class="step">2 Profile</span><span class="step">3 Preferences</span><span class="step">4 Complete</span></div><h1 class="title" style="margin-top:18px">Welcome to JobHub</h1><p class="subtitle">Complete your profile to unlock personalized job matching.</p></div><div class="card form-card"><div class="grid g2"><div><div class="field"><label>Full name</label><input id="obName" value="${esc(state.profile.name)}"></div><div class="field" style="margin-top:10px"><label>Location</label><input id="obLoc" value="${esc(state.profile.location)}"></div><div class="field" style="margin-top:10px"><label>Skills</label><input id="obSkills" value="${esc(state.profile.skills)}"></div></div><div class="card ai-panel pad"><b>Profile unlocks</b><div class="list-row">✓ Personalized matches</div><div class="list-row">✓ Saved jobs & applications</div><div class="list-row">✓ AI career assistant</div><div class="list-row">✓ Skill-gap learning plan</div></div></div><div class="form-actions">${B('Complete onboarding','primary','completeOnboarding()')}</div></div></div>`,'Onboarding')}`}
function completeOnboarding(){state.profile.name=document.getElementById('obName')?.value||state.profile.name;state.profile.location=document.getElementById('obLoc')?.value||state.profile.location;state.profile.skills=document.getElementById('obSkills')?.value||state.profile.skills;state.route='dashboard';persist();render();toast('Profile ready')}
function portalShell(content,title='Dashboard'){const r=ROLES[state.role];const menu=r.menu.filter(m=>canAccess(m[2]));const mobileSearch=(state.role==='recruiter'||state.role==='employer')?'candidates':'jobs';const mobileSaved=state.role==='employer'?'pipeline':state.role==='recruiter'?'shortlists':'saved';const nav=menu.map(m=>`<div class="portal-nav ${state.route===m[2]?'active':''}" onclick="go('${m[2]}')">${m[0]} &nbsp; ${m[1]}</div>`).join('');return `<div class="portal"><aside class="portal-side"><div class="brand" onclick="go('dashboard')" style="cursor:pointer">▰ Job<span style="color:#63a8ff">Hub</span></div><div class="portal-group">${r.group}</div>${nav}<div class="portal-group">Account</div><div class="portal-nav ${state.route==='profile'?'active':''}" onclick="go('profile')">◯ Profile</div><div class="portal-nav ${state.route==='notifications'?'active':''}" onclick="go('notifications')">🔔 Notifications</div><div class="portal-nav" onclick="logout()">↪ Sign out</div><div class="portal-group">Demo RBAC</div><div class="small" style="padding:7px 10px;color:#8ea9c6">Role: <b style="color:#fff">${r.name}</b><br>${menu.length} modules accessible</div></aside><main class="portal-main"><header class="portal-top"><div class="crumb">JobHub <span>/ ${esc(title)}</span></div><div class="top-actions"><button class="btn ghost" onclick="go('notifications')">🔔</button><div class="avatar">${r.initial}</div><div class="top-user-name"><b>${esc(state.profile.name||'Demo User')}</b><div class="small muted">${r.group}</div></div></div></header><section class="portal-content">${content}</section><nav class="mobile-portal-nav"><button class="${['dashboard','recruiter','employer','admin'].includes(state.route)?'active':''}" onclick="go('dashboard')">⌂<br>Home</button><button class="${state.route===mobileSearch?'active':''}" onclick="go('${mobileSearch}')">⌕<br>Search</button><button onclick="go('${mobileSaved}')">♥<br>Saved</button><button onclick="go('notifications')">🔔<br>Alerts</button><button onclick="go('profile')">◯<br>Profile</button></nav></main></div><div style="position:fixed;right:14px;bottom:16px;z-index:90;background:#0f2745;color:#fff;padding:7px 8px;border-radius:9px;font-size:10px">Persona <select onchange="switchRole(this.value)" style="background:#17395f;color:#fff;border:1px solid #476889;border-radius:6px;padding:5px">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k===state.role?'selected':''}>${v.name}</option>`).join('')}</select></div>`}
function dashboardContent(){const r=state.role;if(r==='recruiter')return recruiterDashboard();if(r==='employer')return employerDashboard();if(r==='admin')return adminDashboard();return candidateDashboard()}
function candidateDashboard(){const label=state.role==='fresher'?'Good morning, Sarah — ready to start your career?':state.role==='professional'?'Welcome back — let’s move your career forward.':'Welcome back, Sarah!';return `<div class="stack"><div class="hero-panel"><div class="row between"><div><div style="font-size:12px;color:#bdd8ff">${ROLES[state.role].group}</div><h1 style="margin:4px 0;font-size:26px">${label}</h1><p style="margin:0;color:#d7e8fb">Your career overview, matches and next best actions.</p></div>${B('Discover jobs','secondary','go(\'jobs\')')}</div></div><div class="metrics"><div class="metric-card card"><span>Saved Jobs</span><b>${state.saved.length}</b><div class="delta">+3 this week</div></div><div class="metric-card card"><span>Applications</span><b>${state.applications.length}</b><div class="delta">2 in progress</div></div><div class="metric-card card"><span>Job Matches</span><b>28</b><div class="delta">+6 today</div></div><div class="metric-card card"><span>New Alerts</span><b>3</b><div class="delta">Fresh opportunities</div></div></div><div class="grid g3"><div class="card pad" style="grid-column:span 2"><div class="row between"><h3 style="margin:0">Recommended for you</h3><a style="color:var(--blue);font-size:11px;font-weight:800" onclick="go('jobs')">View all →</a></div><div class="stack" style="margin-top:10px">${JOBS.slice(0,3).map(j=>cardJob(j,true)).join('')}</div></div><div class="stack"><div class="card pad"><span class="badge purple">Skill Gap Analysis</span><h3>You’re ${state.role==='fresher'?'ready to build':'70%'} ready for your target roles.</h3>${[['Java',90],['Spring Boot',86],['Kubernetes',60],['System Design',50]].map(x=>`<div class="list-row"><div class="row between"><span>${x[0]}</span><b>${x[1]}%</b></div><div class="progress"><i style="width:${x[1]}%"></i></div></div>`).join('')}${B('View learning path','secondary','go(\'learning\')')}</div><div class="card pad ai-panel"><span class="badge purple">AI Career Assistant</span><h3>What should I do next?</h3><p class="small muted">Optimize your CV, analyze gaps, prepare an interview, or explore career paths.</p>${B('Open AI assistant','primary','go(\'assistant\')')}</div></div></div></div>`}
function recruiterDashboard(){return `<div class="stack"><div class="hero-panel"><div class="row between"><div><div style="font-size:12px;color:#bdd8ff">Talent Acquisition</div><h1 style="margin:4px 0;font-size:26px">Welcome, Ahmed!</h1><p style="margin:0;color:#d7e8fb">Find the right talent faster with AI-assisted matching.</p></div>${B('Post a new job','secondary','go(\'requisitionForm\')')}</div></div><div class="metrics"><div class="metric-card card"><span>Active jobs</span><b>5</b></div><div class="metric-card card"><span>Applications</span><b>248</b></div><div class="metric-card card"><span>Shortlisted</span><b>32</b></div><div class="metric-card card"><span>Hired</span><b>8</b></div></div><div class="card pad"><div class="row between"><h3 style="margin:0">Recent Applications</h3><a onclick="go('recruitApplications')" style="font-size:11px;color:var(--blue);font-weight:800">View all →</a></div><table class="table"><thead><tr><th>Candidate</th><th>Role</th><th>Match</th><th>Status</th></tr></thead><tbody>${['Ali Khan','Sara Ali','Omar Hassan','Fatima Noor','Ahmed Raza'].map((n,i)=>`<tr><td>${n}</td><td>${['Java Developer','Backend Developer','DevOps Engineer','Java Developer','Software Engineer'][i]}</td><td><span class="badge ${i<3?'green':'orange'}">${92-i*5}%</span></td><td>${['Shortlisted','Interview','New','Review','New'][i]}</td></tr>`).join('')}</tbody></table></div></div>`}
function employerDashboard(){return `<div class="stack"><div class="hero-panel"><div class="row between"><div><div style="font-size:12px;color:#bdd8ff">Company Workspace</div><h1 style="margin:4px 0;font-size:26px">Careem</h1><p style="margin:0;color:#d7e8fb">Manage jobs, candidates, employer branding and insights.</p></div>${B('Post a job','secondary','go(\'postJob\')')}</div></div><div class="metrics"><div class="metric-card card"><span>Active Jobs</span><b>24</b></div><div class="metric-card card"><span>Applications</span><b>1,250</b></div><div class="metric-card card"><span>Avg. time to hire</span><b>32d</b></div><div class="metric-card card"><span>Qualified rate</span><b>92%</b></div></div><div class="grid g2"><div class="card pad"><h3>Applications trend</h3><div class="chart">${[40,55,48,72,62,83,74,94].map(h=>`<div class="bar" style="height:${h}%"></div>`).join('')}</div></div><div class="card pad"><h3>Top hiring locations</h3><div class="donut"></div><div class="legend"><span><i>● UAE</i><b>45%</b></span><span><i>● Saudi Arabia</i><b>20%</b></span><span><i>● India</i><b>15%</b></span><span><i>● Other</i><b>20%</b></span></div></div></div></div>`}
function adminDashboard(){return `<div class="stack"><div class="hero-panel"><div class="row between"><div><div style="font-size:12px;color:#bdd8ff">Platform Operations</div><h1 style="margin:4px 0;font-size:26px">JobHub Admin</h1><p style="margin:0;color:#d7e8fb">Monitor ingestion, quality, AI processing and platform health.</p></div>${B('Review AI queue','secondary','go(\'aireview\')')}</div></div><div class="metrics"><div class="metric-card card"><span>Jobs indexed</span><b>250K</b></div><div class="metric-card card"><span>Active jobs</span><b>120K</b></div><div class="metric-card card"><span>Users</span><b>45K</b></div><div class="metric-card card"><span>Uptime</span><b>99.9%</b></div></div><div class="card pad"><h3>Ingestion status</h3><table class="table"><thead><tr><th>Source</th><th>Run</th><th>Jobs</th><th>Status</th></tr></thead><tbody>${[['Event Jobs','Running','12,450','green'],['GitHub Jobs','Completed','3,220','blue'],['Linked Jobs','Running','8,760','green'],['Company Careers','Failed','1,230','orange']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td><span class="badge ${x[3]}">${x[1]}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function genericPage(title,subtitle,body,cta){return `${portalShell(`<div class="stack"><div class="row between"><div><h1 class="title">${title}</h1><p class="subtitle">${subtitle}</p></div>${cta||''}</div>${body}</div>`,title)}`}
function saved(){const xs=JOBS.filter(j=>state.saved.includes(j.id));return genericPage('Saved Jobs','Your shortlist for later.',`<div class="job-list">${xs.length?xs.map(j=>cardJob(j)).join(''):`<div class="card pad"><h3>No saved jobs yet</h3><p class="small muted">Save a job from search or job detail.</p>${B('Find jobs','primary','go(\'jobs\')')}</div>`}</div>`)}
function applications(){return genericPage('My Applications','Track your application journey.',`<div class="kanban">${['Saved','Applied','Screening','Interview','Offer'].map((col,i)=>`<div class="kanban-col"><h4>${col}</h4>${JOBS.filter(j=>state.applications.includes(j.id)).slice(0,2).map(j=>`<div class="kanban-item" onclick="openJob(${j.id})"><b>${j.title}</b><div class="small muted">${j.company}</div><div style="margin-top:5px"><span class="badge ${i>2?'green':'blue'}">${i===0?'Draft':col}</span></div></div>`).join('')}</div>`).join('')}</div>`)}
function assistant(){return `${portalShell(`<div class="assistant"><div class="chat"><div><span class="badge purple">AI Career Assistant</span><h2 style="margin:8px 0">Your career co-pilot</h2></div><div class="chat-body"><div class="bubble ai">Hi ${esc(state.profile.name.split(' ')[0]||'there')}! I can analyze your CV, find skill gaps, rewrite content, explain jobs and create an action plan.</div><div class="bubble me">Show me the best next steps for backend roles.</div><div class="bubble ai">Based on your profile, prioritize Kubernetes, system design and AI-enabled backend patterns. I also found 3 strong matches you can explore from Discover Jobs.</div></div><div class="chat-input"><input id="chatQ" placeholder="Ask anything about your career...">${B('Send','primary','sendChat()')}</div></div><aside class="stack"><div class="card pad ai-panel"><h3>Quick actions</h3>${['Analyze my CV','Write cover letter','Find skill gaps','Recommend courses','Prepare for interview'].map(x=>`<button class="btn secondary" style="width:100%;margin:4px 0;text-align:left" onclick="toast('${x} started in demo mode')">✦ ${x}</button>`).join('')}</div><div class="card pad"><h3>Today’s focus</h3><p class="small muted">1) Update resume  2) Learn Kubernetes  3) Apply to 3 high-fit roles</p></div></aside></div>`,'AI Career Assistant')}`}
function sendChat(){const q=document.getElementById('chatQ')?.value||'career advice';toast('AI response generated for: '+q);render()}
function learning(){return genericPage(state.role==='fresher'?'Learning Path':'Skills & Learning','Close your skill gaps with targeted learning.',`<div class="grid g3">${[['Kubernetes Foundations',82,'High demand'],['System Design',60,'Target role'],['Applied GenAI',54,'Market rising'],['AWS Architecture',73,'Strong fit'],['Advanced SQL',68,'Common gap'],['Leadership',48,'Senior roles']].map(x=>`<div class="card pad"><span class="badge ${x[2]==='Market rising'?'purple':'blue'}">${x[2]}</span><h3>${x[0]}</h3><div class="progress" style="margin:10px 0"><i style="width:${x[1]}%"></i></div><div class="row between"><span class="small muted">${x[1]}% ready</span>${B('View path','secondary','toast(\''+x[0]+' learning path opened\')')}</div></div>`).join('')}</div>`)}
function market(){return genericPage('Market Intelligence','See demand by skills, roles, locations and industries.',`<div class="grid g2"><div class="card pad"><h3>Demand trend</h3><div class="chart">${[35,45,55,52,68,62,78,90].map(h=>`<div class="bar" style="height:${h}%"></div>`).join('')}</div></div><div class="card pad"><h3>Top skills this month</h3>${[['AI / LLM',96],['Cloud',89],['Kubernetes',84],['Java',78],['Data Engineering',72]].map(x=>`<div class="list-row"><div class="row between"><span>${x[0]}</span><b>${x[1]}</b></div><div class="progress"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div></div><div class="card pad"><h3>Forecast</h3><p class="small muted">JobHub’s forecast is a planning signal, not certainty. Expected demand is trending upward for AI-enabled engineering and cloud-native roles.</p>${B('Explore target roles','primary','go(\'targets\')')}</div>`,state.role==='seeker'?B('Create alert','secondary','createAlertModal()'):null)}
function notifications(){return genericPage('Notifications','Manage personalized job, career and platform alerts.',`<div class="card pad">${[['New 95% match','Senior Java Developer at Emirates NBD','Today'],['Learning reminder','Kubernetes path is 20% complete','Yesterday'],['Application update','Your application moved to Screening','2 days ago'],['Market alert','AI engineering demand increased in UAE','3 days ago']].map(x=>`<div class="list-row"><div class="row between"><div><b>${x[0]}</b><div class="small muted">${x[1]}</div></div><span class="small muted">${x[2]}</span></div></div>`).join('')}</div><div class="card pad"><h3>Notification preferences</h3><div class="grid g2"><label class="row"><input type="checkbox" checked> Job matches</label><label class="row"><input type="checkbox" checked> Application updates</label><label class="row"><input type="checkbox" checked> Learning reminders</label><label class="row"><input type="checkbox"> WhatsApp alerts</label></div><div class="form-actions">${B('Save preferences','primary','toast(\'Notification preferences saved\')')}</div></div>`) }
function profile(){return genericPage('Profile & Resume','Keep your professional profile ready for matching and applications.',`<div class="grid g2"><div class="card form-card"><div class="field"><label>Full name</label><input id="pName" value="${esc(state.profile.name)}"></div><div class="field" style="margin-top:10px"><label>Email</label><input id="pEmail" value="${esc(state.profile.email)}"></div><div class="field" style="margin-top:10px"><label>Location</label><input id="pLoc" value="${esc(state.profile.location)}"></div><div class="field" style="margin-top:10px"><label>Skills</label><textarea id="pSkills" rows="4">${esc(state.profile.skills)}</textarea></div><div class="form-actions">${B('Save profile','primary','saveProfile()')}</div></div><div class="stack"><div class="card pad ai-panel"><span class="badge purple">Resume intelligence</span><h3>Resume ready for AI matching</h3><p class="small muted">Upload, extract, review and save structured profile data. In this prototype the form simulates the flow.</p>${B('Simulate resume upload','secondary','toast(\'Resume parsed and saved in demo mode\')')}</div><div class="card pad"><h3>Profile strength</h3><div class="row between"><span>Overall</span><b>92%</b></div><div class="progress"><i style="width:92%"></i></div><div class="list-row">✓ Contact details</div><div class="list-row">✓ Skills</div><div class="list-row">✓ Experience</div><div class="list-row">+ Add portfolio link</div></div></div></div>`,null)}
function saveProfile(){state.profile.name=document.getElementById('pName')?.value||state.profile.name;state.profile.email=document.getElementById('pEmail')?.value||state.profile.email;state.profile.location=document.getElementById('pLoc')?.value||state.profile.location;state.profile.skills=document.getElementById('pSkills')?.value||state.profile.skills;persist();render();toast('Profile saved')}
function settings(){return genericPage('Settings','Account, privacy and workspace preferences.',`<div class="card pad"><div class="list-row"><div class="row between"><div><b>Profile visibility</b><div class="small muted">Allow employers to discover your profile.</div></div><input type="checkbox" checked></div></div><div class="list-row"><div class="row between"><div><b>Job recommendations</b><div class="small muted">Use profile and market signals.</div></div><input type="checkbox" checked></div></div><div class="list-row"><div class="row between"><div><b>WhatsApp notifications</b><div class="small muted">Receive selected high-fit job alerts.</div></div><input type="checkbox"></div></div><div class="form-actions">${B('Save settings','primary','toast(\'Settings saved\')')}</div></div>`)}
function internships(){return genericPage('Internships','Entry-level and internship opportunities.',`<div class="job-list">${JOBS.filter(j=>j.title.includes('Data')||j.company==='Innovate Labs').map(j=>cardJob(j)).join('')}</div>`)}
