spring:
  application:
    name: jobhub-platform-api
  datasource:
    url: ${JOBHUB_DB_URL:jdbc:postgresql://localhost:5432/jobhub}
    username: ${JOBHUB_DB_USER:jobhub}
    password: ${JOBHUB_DB_PASSWORD:jobhub}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: jobhub
    open-in-view: false
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

jobhub:
  security:
    jwt-secret: ${JOBHUB_JWT_SECRET:jobhub-dev-secret-change-me-please-32-bytes}
  cors:
    allowed-origin: ${JOBHUB_WEB_ORIGIN:http://localhost:3000}
  outbox:
    fixed-delay-ms: 2000

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:ministral-3:14b}

logging:
  level:
    com.jobhub: DEBUG
    org.springframework.security: INFO
