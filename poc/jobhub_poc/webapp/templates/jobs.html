{% extends "base.html" %}
{% block content %}
<h1 id="jobs-count">Jobs</h1>
<form id="filter-form" class="filters">
  <input type="text" id="title-input" placeholder="Title contains...">
  <input type="text" id="location-input" placeholder="Location contains...">
  <select id="sort-select">
    <option value="freshness">Newest first</option>
    <option value="title">Title A-Z</option>
  </select>
  <button type="submit">Filter</button>
</form>
<table>
  <tr><th>Title</th><th>Company</th><th>Location</th><th>First seen</th><th></th></tr>
  <tbody id="jobs-body">
    <tr><td colspan="5">Loading...</td></tr>
  </tbody>
</table>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
