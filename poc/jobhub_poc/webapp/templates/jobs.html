{% extends "base.html" %}
{% block content %}
<div id="jobs-app" data-access="{{ access_state() }}"></div>
<div class="jobs-toolbar">
  <form id="filter-form" class="filters">
    <input type="text" id="title-input" placeholder="Title contains...">
    <input type="text" id="location-input" placeholder="Location contains...">
    <select id="posted-within-select" aria-label="Posted within"></select>
    <select id="sort-select" aria-label="Sort">
      <option value="freshness">Newest on JobsHub</option>
      <option value="posted">Recently posted</option>
      <option value="title">Title A-Z</option>
    </select>
    <select id="page-size-select">
      <option value="10">10 / page</option>
      <option value="25">25 / page</option>
      <option value="50">50 / page</option>
      <option value="100">100 / page</option>
    </select>
    <button type="submit">Filter</button>
  </form>
</div>
<section id="job-detail" class="job-detail" hidden></section>
<p id="jobs-count" class="jobs-count">Loading...</p>
<div class="table-wrap">
  <table>
    <thead>
      <tr><th class="serial">#</th><th>Title</th><th>Company</th><th>Location</th><th>Posted</th><th></th></tr>
    </thead>
    <tbody id="jobs-body">
      <tr><td colspan="6" class="empty">Loading...</td></tr>
    </tbody>
  </table>
</div>
<nav id="pagination" class="pagination"></nav>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
