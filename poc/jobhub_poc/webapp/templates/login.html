{% extends "base.html" %}
{% import "_turnstile.html" as turnstile with context %}
{% block content %}
<div class="mx-auto max-w-md"><div class="card p-5 sm:p-7">
<h1>Log in</h1>
<p id="login-error" class="error" hidden></p>
<form id="login-form">
  <label>Email <input type="email" id="login-email" name="email" required></label>
  <label>Password <input type="password" id="login-password" name="password" required></label>
  <button type="submit">Log in</button>
</form>
<p>Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a></p>
{{ turnstile.explicit() }}
<script src="{{ url_for('static', filename='auth.js') }}"></script>
</div></div>
{% endblock %}
