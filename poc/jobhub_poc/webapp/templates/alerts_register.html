{% extends "base.html" %}
{% import "_turnstile.html" as turnstile with context %}
{% block content %}
<h1>Register a job alert</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">
  <label>WhatsApp number (with country code) <input type="tel" name="phone_number" inputmode="tel" placeholder="+91 98765 43210" required></label>
  <label>Title contains <input type="text" name="title_keyword" placeholder="(optional)"></label>
  <label>Location contains <input type="text" name="location_keyword" placeholder="(optional)"></label>
  {{ turnstile.widget("alert_register") }}
  <button type="submit">Register</button>
</form>
{% endblock %}
