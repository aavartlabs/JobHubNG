{% extends "base.html" %}
{% block title %}{{ job.title }} · JobsHub{% endblock %}
{% block content %}
<article class="mx-auto max-w-3xl">
  <a href="{{ back_url }}" class="back-link inline-flex min-h-11 items-center gap-1 text-sm font-medium no-underline sm:min-h-0">← Back to jobs</a>
  <div class="card mt-2 p-4 sm:p-6">
    {% with in_panel = false %}{% include "_job_detail.html" %}{% endwith %}
  </div>
  <p class="mt-5"><a href="{{ back_url }}" class="back-link btn btn-secondary">← Back to jobs</a></p>
</article>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='app.js') }}"></script>{% endblock %}
