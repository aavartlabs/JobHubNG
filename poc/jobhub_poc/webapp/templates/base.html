<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>JobHub POC</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <strong>JobHub POC</strong>
    <nav>
      <a href="{{ url_for('jobs.list_jobs') }}">Jobs</a>
      {% if is_admin() %}
        <a href="{{ url_for('admin.users') }}">Users (admin)</a>
        <form method="post" action="{{ url_for('admin.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit">Admin logout</button>
        </form>
      {% endif %}
      {% if g.current_user %}
        <a href="{{ url_for('alerts.list_alerts') }}">Alerts</a>
        {# POST, not a link -- see auth.py's logout(). #}
        <form method="post" action="{{ url_for('auth.logout') }}"><button type="submit">Logout</button></form>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Login</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for message in get_flashed_messages() %}<p class="flash">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
