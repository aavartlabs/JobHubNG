<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}JobsHub{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2A1238">
  <link rel="icon" href="{{ url_for('static', filename='brand/favicon.ico') }}" sizes="any">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='brand/favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='brand/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('jobs.list_jobs') }}" aria-label="JobsHub home">
      <img src="{{ url_for('static', filename='brand/mark-64.png') }}" alt="" width="30" height="33">
      <span><span class="brand-name">JobsHub</span><span class="brand-by">by aavartlabs</span></span>
    </a>
    <nav>
      <a href="{{ url_for('jobs.list_jobs') }}">Jobs</a>
      {% if is_admin() %}
        <a href="{{ url_for('admin.users') }}">Users (admin)</a>
        <form method="post" action="{{ url_for('admin.logout') }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit">Admin logout</button>
        </form>
      {% endif %}
      {% if g.current_user %}
        <a href="{{ url_for('alerts.list_alerts') }}">Alerts</a>
        {# POST, not a link -- see auth.py's logout(). #}
        <form method="post" action="{{ url_for('auth.logout') }}"><button type="submit">Logout</button></form>
      {% else %}
        <a href="{{ url_for('auth.login') }}">Login</a>
        <a href="{{ url_for('auth.register') }}">Register</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% for message in get_flashed_messages() %}<p class="flash">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
