services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobhub-web
    env_file: .env
    environment:
      JOBHUB_SQLITE_PATH: /app/data/jobhub.db
      # Logs that survive a rebuild (docker logs go with the old container):
      # ~/jobhub-poc/data/logs/web.log on pi09, rotated 5 x 5 MB (webapp/app.py).
      JOBHUB_LOG_FILE: /app/data/logs/web.log
      # Overrides the shared .env's WEB_PORT (8100, left over from the old plain-venv
      # deployment) -- the container MUST listen on 3000 internally to match what the
      # Cloudflare Tunnel is fixed to target (http://jobhub-web:3000). Host access is
      # still on 8100 via the port mapping below.
      WEB_PORT: "3000"
      # Reached only over the jobhub Docker network's embedded DNS -- auth-service below
      # publishes no host port. Port 3200 matches auth-service's own PORT default
      # (src/server.js / .env.example), not an arbitrary choice.
      AUTH_SERVICE_URL: http://auth-service:3200
      # The shared .env's gateway URLs are localhost, right for the alert CLIs on the host
      # but not inside this container (admin sign-in codes are sent from here, and
      # /telegram/webhook forwards to the Telegram gateway).
      WHATSAPP_GATEWAY_URL: http://whatsapp:3100
      TELEGRAM_GATEWAY_URL: http://telegram:3300
    volumes:
      - ./data:/app/data
    ports:
      - "8100:3000"
    networks:
      - jobhub
    restart: unless-stopped

  # Runs queued AI tasks (resume parsing now; job matching and tailoring later) against the
  # hosted AI services (TypeSafe Jev, OpenRouter, Meta; keys in poc/.env). Same image as web; while they're unreachable, tasks
  # simply wait (jobhub_poc/ai/worker.py).
  ai:
    image: jobhub-poc-web
    pull_policy: never
    container_name: jobhub-ai
    command: ["python", "-m", "jobhub_poc.ai.worker"]
    env_file: .env
    environment:
      JOBHUB_SQLITE_PATH: /app/data/jobhub.db
    volumes:
      - ./data:/app/data
    depends_on:
      - web
    networks:
      - jobhub
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    container_name: jobhub-auth
    env_file: ./auth-service/.env
    environment:
      # Overrides whatever AUTH_DB_PATH is in .env (its own .env.example default,
      # ./auth.db, resolves to /app/auth.db -- outside the volume below, so it wouldn't
      # survive a container recreate). Must stay under /app/data to actually land on the
      # mounted volume.
      AUTH_DB_PATH: /app/data/auth.db
      # Telegram account linking (src/telegram.js): the bot's @username for the
      # t.me/<bot>?start=<token> links, and the key telegram-gateway presents on
      # /internal/telegram/start. Both from poc/.env.
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?set TELEGRAM_BOT_USERNAME in poc/.env (the bot's @username, without the @)}
      TELEGRAM_INTERNAL_API_KEY: ${TELEGRAM_INTERNAL_API_KEY:?set TELEGRAM_INTERNAL_API_KEY in poc/.env (openssl rand -hex 32)}
      # Both of these must be the PUBLIC origin the browser (and Flask) talk to -- not
      # this service's internal address, which is what auth-service/.env.example's
      # standalone-dev defaults use. WEB_ORIGIN comes from poc/.env (the same value
      # Flask's own /logout sends as its Origin header), so there is exactly one place
      # to set the public origin for the whole deployment. `:?` on purpose: a silently
      # wrong origin here means https session cookies issued without Secure and 403s on
      # sign-out, which is worse than compose refusing to start.
      BETTER_AUTH_URL: ${WEB_ORIGIN:?set WEB_ORIGIN in poc/.env to this deployment's public origin, e.g. https://jobshub.aavartlabs.com}
      TRUSTED_ORIGINS: ${WEB_ORIGIN:?set WEB_ORIGIN in poc/.env to this deployment's public origin, e.g. https://jobshub.aavartlabs.com}
      # Key for /internal/admin/* (src/admin.js), shared with web's AUTH_ADMIN_API_KEY so
      # both sides read one value from poc/.env.
      ADMIN_API_KEY: ${AUTH_ADMIN_API_KEY:?set AUTH_ADMIN_API_KEY in poc/.env (openssl rand -base64 32)}
    volumes:
      - ./auth-service/data:/app/data
    # Loopback only -- never the LAN, never the internet (the Cloudflare Tunnel targets
    # jobhub-web alone). The alert pipeline runs on pi09's host, not in a container, and
    # reads alert owners' verified contacts from /internal/admin/users
    # (alerts/contacts.py, key AUTH_ADMIN_API_KEY) through this port. Browsers still only
    # ever reach this service via web's /auth/* proxy.
    ports:
      - "127.0.0.1:3200:3200"
    networks:
      - jobhub
    restart: unless-stopped

  # The only holder of the bot token (poc/telegram-gateway). No env_file on purpose: it
  # gets exactly these values from poc/.env, nothing else from it.
  telegram:
    build: ./telegram-gateway
    container_name: jobhub-telegram
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in poc/.env (from @BotFather)}
      TELEGRAM_GATEWAY_API_KEY: ${TELEGRAM_GATEWAY_API_KEY:?set TELEGRAM_GATEWAY_API_KEY in poc/.env (openssl rand -hex 32)}
      # Telegram posts updates to web's /telegram/webhook, which forwards them here.
      TELEGRAM_WEBHOOK_URL: ${WEB_ORIGIN:?set WEB_ORIGIN in poc/.env}/telegram/webhook
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?set TELEGRAM_WEBHOOK_SECRET in poc/.env (openssl rand -hex 32)}
      AUTH_SERVICE_URL: http://auth-service:3200
      TELEGRAM_INTERNAL_API_KEY: ${TELEGRAM_INTERNAL_API_KEY:?set TELEGRAM_INTERNAL_API_KEY in poc/.env}
      SITE_URL: ${WEB_ORIGIN}
    # Loopback only, like auth-service: the alert CLIs on pi09's host send digests and
    # admin messages through this port.
    ports:
      - "127.0.0.1:3300:3300"
    networks:
      - jobhub
    restart: unless-stopped

  # The Cloudflare Tunnel connector: the only way the public reaches the site. Its ingress
  # (set in the Cloudflare dashboard) targets http://jobhub-web:3000 on this network.
  # The token is read from a file, never from env/args, so `docker inspect` can't show it.
  # On pi09: ~/jobhub-poc/secrets/ (0700) holds cloudflare-tunnel.token (0644 so the
  # container's nonroot user can read it). Rotate it in the dashboard (Networking >
  # Tunnels > jobhub-aavartlabs-com > Rotate token), replace the file, then
  # `docker compose up -d --force-recreate tunnel`.
  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    container_name: jobhub-cloudflare-tunnel
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/tunnel-token
    volumes:
      - ./secrets/cloudflare-tunnel.token:/run/secrets/tunnel-token:ro
    depends_on:
      - web
    networks:
      - jobhub
    restart: unless-stopped

  whatsapp:
    build:
      context: ./whatsapp-sender
    container_name: jobhub-whatsapp
    env_file: ./whatsapp-sender/.env
    volumes:
      - ./whatsapp-sender/auth_info:/app/auth_info
    ports:
      - "3100:3100"
    networks:
      - jobhub
    restart: unless-stopped

networks:
  jobhub:
    external: true
    name: jobhub
