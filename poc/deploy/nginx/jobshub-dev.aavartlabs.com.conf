# jobshub-dev.aavartlabs.com -- JobsHub on this host, side by side with the Pis (then the
# live site: copy this file with server_name jobshub.aavartlabs.com jobhubs.aavartlabs.com).
#
# Deployed into the shared edge proxy at ~/projects/edge/nginx/conf.d/ on testprepup; this
# is the versioned copy (poc/deploy/nginx/). Check with `nginx -t` before `nginx -s reload`.
#
# TLS: Cloudflare terminates browser TLS; the aavartlabs.com zone is in SSL mode "Full", so
# the origin presents the host's existing testprepup.com certificate, like crm/dip.
#
# Only Cloudflare may connect (checked on the connecting address, $realip_remote_addr), and
# the visitor's IP is taken from CF-Connecting-IP only when Cloudflare sent it. The app reads
# CF-Connecting-IP (webapp/auth.py client_ip) for rate limits and lockouts, so it's always
# overwritten here with the verified address -- a forged header never reaches Flask.
# Cloudflare's ranges: https://www.cloudflare.com/ips/ (checked 2026-09-25).
#
# Upstream by name at request time (resolver + variable), not in an upstream block: if the
# JobsHub containers are down, this site returns 502 but the shared nginx still reloads and
# the other sites are untouched.

geo $realip_remote_addr $jobshub_from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name jobshub-dev.aavartlabs.com;
    if ($jobshub_from_cloudflare = 0) { return 403; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jobshub-dev.aavartlabs.com;

    ssl_certificate     /etc/letsencrypt/live/testprepup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testprepup.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    if ($jobshub_from_cloudflare = 0) { return 403; }

    client_max_body_size 6M;   # resume uploads are capped at 5 MB by the app
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    resolver 127.0.0.11 valid=10s ipv6=off;   # Docker's DNS on the edge network
    set $jobshub_web http://jobhub-web:3000;

    location / {
        proxy_pass $jobshub_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
