# JobHub data pipeline settings, read by jobhub_poc/pipeline_config.py on both hosts:
# pi05 (EverJobs sweep -> warehouse.db -> delta export) and pi09 (serving jobhub.db).
#
# Every key can be overridden with an env var JOBHUB_PIPELINE_<SECTION>_<KEY>, e.g.
#   JOBHUB_PIPELINE_INGEST_MAX_POSTED_AGE_DAYS=30
# and the file itself can be swapped with JOBHUB_PIPELINE_INI=/path/to/other.ini.
# Unknown sections/keys are rejected, so a typo fails loudly instead of being ignored.
# Lists are comma-separated, case-insensitive, and deduplicated.

[ingest]
# Reject a job at warehouse ingest if its (normalised) posted date is older than this.
# Jobs with no or unparseable posted date are kept and aged by first_seen instead.
# 0 = no age limit.
max_posted_age_days = 60

[retention]
# Warehouse (pi05): delete jobs not seen in any sweep for this many days.
warehouse_retention_days = 30
# Serving DB (pi09 jobhub.db): delete jobs not seen for this many days.
serving_retention_days = 15
# Keep the raw EverJobs sweep JSON on pi05 for this many days (debugging only).
# 0 = don't write raw dumps at all.
keep_raw_dumps_days = 0

[serving]
# A warehouse job is exported to the serving DB (the site + alerts) if its title
# contains any of these terms -- plus any active alert's titles/keywords (see [sync]).
search_terms = engineer, product manager, data analyst, data scientist, designer, marketing,
    sales, customer success, operations, finance, human resources, devops,
    quality assurance, content, recruiter, manager, analyst, consultant, intern, director,
    developer, architect, programmer, tester
# Optional: only export jobs whose location contains one of these. Empty = anywhere.
locations =
# Optional cap on exported jobs per search term per export. 0 = no cap.
results_per_term = 0

[sync]
# Upper bound on distinct terms taken from active alerts per export, so one alert
# with a very broad term list can't pull the whole warehouse into the serving DB.
max_alert_terms = 200

[archive]
# Job history (warehouse jobs_archive + job_versions) older than this is exported monthly
# to MinIO archive/history/ as gzip JSONL and then removed from warehouse.db (M6).
cold_after_days = 90

[enrich]
# pi05 fills in what EverJobs leaves out (scraper/enrich.py, between ingest and export):
# SmartRecruiters jobs come with no description and an API URL as their link, so their
# public posting is fetched once. Postings fetched per pipeline run (0 = off); the first
# runs work through the backlog, later ones only new jobs.
max_per_run = 600
# A fetch that failed (network, 5xx) is tried again after this many days.
retry_after_days = 7
# Pause between fetches, in milliseconds.
delay_ms = 500

[sources]
# Job-board APIs fetched at ingest, next to the EverJobs sweep (scraper/api_sources.py):
# official APIs, so they aren't blocked like Naukri/Indeed are to the scraper. Keys in
# scraper/.env (ADZUNA_APP_ID, ADZUNA_APP_KEY, CAREERJET_AFFID). Empty = none.
enabled = adzuna, careerjet
# One request per query per source, newest jobs first.
queries = software engineer, developer, java developer, python developer, full stack developer,
    data engineer, data analyst, data scientist, machine learning engineer, devops engineer,
    cloud engineer, qa engineer, test engineer, sap consultant, salesforce developer,
    business analyst, product manager, project manager, cyber security, frontend developer
adzuna_country = in
# Adzuna's free plan limits requests per day and per month: 4 runs x 20 = 80 a day.
adzuna_requests_per_run = 20
careerjet_locale = en_IN
careerjet_location = India
careerjet_requests_per_run = 20
# Pause between two requests to the same source, in milliseconds.
delay_ms = 2500
